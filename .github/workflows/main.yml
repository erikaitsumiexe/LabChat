name: Release LabChat (Windows & Linux)

on:
  push:
    tags:
      - 'v0.1.1'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies (WebKitGTK & AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.1.1
          releaseName: 'LabChat v0.1.1'
          releaseBody: |
            ### 🚀 LabChat v0.1.1
            - **Windows:** Kurulum için `*-setup.exe` veya `*.msi` dosyasını çalıştırın.
            - **CachyOS / Arch Linux:** `*.AppImage` dosyasını indirip `chmod +x LabChat_*.AppImage && ./LabChat_*.AppImage` komutuyla doğrudan çalıştırabilirsiniz.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
```

### Önemli Notlar ve Kullanım
* **CachyOS Uyumluluğu:** CachyOS (Arch Linux tabanlı) üzerinde bağımlılık çakışması yaşamadan doğrudan çalışması için Linux tarafında **`--bundles appimage,deb`** yapılandırıldı. CachyOS'ta `.AppImage` dosyasına çalıştırma izni (`chmod +x`) verip doğrudan açabilirsin.
* **Sürüm Numarası Eşitleme:** `tauri-action` derleme sırasında `src-tauri/tauri.conf.json` ve `package.json` içindeki `"version"` alanını okur; bu dosyalardaki sürümü de `"0.1.1"` yapman paket isimlerinin `v0.1.1` ile birebir eşleşmesini sağlar.
* **Tetikleme:** Dosyayı `.github/workflows/release.yml` yoluna kaydettikten sonra terminalden aşağıdaki komutlarla `v0.1.1` etiketini gönderdiğinde derleme ve Release oluşturma otomatik başlar:
  ```bash
  git tag v0.1.1
  git push origin v0.1.1